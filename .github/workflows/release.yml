name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version overriding the checked-in version.
        type: string
        required: false
      dry-run:
        description: Check release prerequisites, such as RubyGems Trusted Publishing, without releasing.
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'mongoid/mongoid_orderable' && github.ref == 'refs/heads/master'
    uses: dblock/ruby-gem-release/.github/workflows/release.yml@v0.9.0
    with:
      ruby-version: '3.3'
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      test: |
        docker run --detach --name mongodb --publish 27018:27018 mongo:8.0 --replSet rs0 --port 27018 --bind_ip_all
        until docker exec mongodb mongosh --port 27018 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27018" }] }).ok }' | grep -q 1; do sleep 1; done
        until docker exec mongodb mongosh --port 27018 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
        MONGODB_HOST=localhost:27018 bundle exec rake
